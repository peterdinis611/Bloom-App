<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #f5f5f7;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100%; }
      .bloom-preload {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #000;
        user-select: none;
      }
      .bloom-preload-mark {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.022em;
      }
      .bloom-preload-mark span { color: #0a84ff; }
      .bloom-preload-ring {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #0a84ff;
        animation: bloom-spin 0.7s linear infinite;
      }
      @keyframes bloom-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .bloom-preload-ring { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bloom-preload" aria-busy="true">
        <div class="bloom-preload-mark">Bloom<span>.</span></div>
        <div class="bloom-preload-ring" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
